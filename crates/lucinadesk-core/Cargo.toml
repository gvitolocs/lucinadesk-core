[package]
name = "lucinadesk-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "LucinaDesk client core: RustDesk rendezvous/relay protocol, handshake and secretbox encryption, compiled to wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prost = "0.13"
crypto_box = { version = "0.9", features = ["salsa20", "getrandom"] }
crypto_secretbox = { version = "0.1", features = ["getrandom"] }
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
ruzstd = "0.7"
png = "0.17"
rand_core = { version = "0.6", features = ["getrandom"] }
sha1_smol = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[build-dependencies]
prost-build = "0.13"
protox = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
